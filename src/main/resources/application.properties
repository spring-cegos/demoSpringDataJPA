spring.application.name=demoSpringDataJPA
# ici je décide quelle implémentation de Service j'utilise
spring.profiles.active=jpa
# la doc d'API genérée par springdoc-openapi va être accessible à l'url : http://localhost:8080/api
springdoc.swagger-ui.path=/api

######## INFOS DE BASE DE DONNEE ########
# url de connexion
#jdbc: protocole
# postgresql: driver de base de donnée utilisé
# localhost : url de notre serveur de base de donnée (ici en local)
# 5432 : port par défaut de postgres
# todo : base de donnée sur laquelle on se connecte

spring.datasource.url=jdbc:postgresql://localhost:5432/todo
# user/password de connexion
spring.datasource.username=postgres
spring.datasource.password=Pa$$w0rd

# est-ce qu'on veut afficher le sql dans les logs
spring.jpa.show-sql=true
# ddl-auto=update => l'appli va modifier automatiquement les tables de
notre base de donnée
spring.jpa.hibernate.ddl-auto=update